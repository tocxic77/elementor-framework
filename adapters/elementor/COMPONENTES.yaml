# ---------------------------------------------------------------------------
# KIT MEDIDO · componentes reales del kit Elementor
#
# Leído con `elementor/list-components` + `component_ids` el 2026-11-01.
# Aquí sólo hay lo que el MCP devolvió: id, uid, nombre y las ranuras expuestas
# (`overridable_props`) con su etiqueta y el esquema del valor.
#
# Lo que el instrumento NO declara, y por tanto queda como no medido:
#   · obligatoriedad de una ranura
#   · repetibilidad de una ranura
#   · si una ranura acepta vacío
# El MCP expone ranuras con clave fija (cifra_1, cifra_2, cifra_3): la repetición
# se consigue instanciando el componente, no rellenando una ranura repetible.
# ---------------------------------------------------------------------------
medido: 2026-11-01
fuente: "elementor/list-components · component_ids [11377, 11380, 11383, 11390, 11393]"
capacidades: {can_create: true, can_edit: true, can_add_to_page: true}
no_medido: [obligatoriedad, repetibilidad, acepta_vacio]

componentes:
  - id: 11377
    nombre: Hero de banda
    uid: component-ee1e6312-031e-44fe-a2bf-cbb4a2531b79
    ranuras:
      - {nombre: antetitulo, etiqueta: Antetítulo, tipo: texto_parrafo}
      - {nombre: titular, etiqueta: Titular, tipo: texto_titulo}
      - {nombre: bajada, etiqueta: Bajada, tipo: texto_parrafo}
      - {nombre: cta, etiqueta: Texto del botón, tipo: texto_boton}
      - {nombre: imagen, etiqueta: Imagen, tipo: imagen, campos: [src, size, alt]}

  - id: 11380
    nombre: Banda de objeción
    uid: component-d3d69d65-78a3-4057-92bc-d976fb04fced
    ranuras:

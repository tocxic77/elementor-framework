      - {nombre: cuerpo, etiqueta: Cuerpo, tipo: texto_parrafo}
    restricciones:
      - "no hay ranura de cita: la voz del cliente sólo puede ir en `etiqueta` o en `titular`"

  - id: 11383
    nombre: Paso del método
    uid: component-d3a97b18-53df-42ee-8019-24ba21cf61af
    ranuras:
      - {nombre: numeral, etiqueta: Numeral, tipo: texto_parrafo}

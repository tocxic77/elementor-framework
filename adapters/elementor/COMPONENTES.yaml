    restricciones:
      - "no hay ranura de entregable ni de duración: el paso sólo lleva numeral, título y texto"

  - id: 11390
    nombre: Bloque de cifras
    uid: component-85bb1be9-30a2-4032-b1b8-a9fcfba4b8dd
    ranuras:
      - {nombre: cifra_1, etiqueta: Cifra 1, tipo: texto_parrafo}
      - {nombre: cifra_2, etiqueta: Cifra 2, tipo: texto_parrafo}
      - {nombre: cifra_3, etiqueta: Cifra 3, tipo: texto_parrafo}
      - {nombre: rotulo_1, etiqueta: Rótulo 1, tipo: texto_parrafo}
    restricciones:
      - "tres cifras y un solo rótulo: las tres comparten unidad o se quedan sin rótulo"
      - "no hay ranura de enlace: la cifra no puede llevar su fuente enlazada dentro del bloque"

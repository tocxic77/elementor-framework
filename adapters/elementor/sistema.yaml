componentes:
  - {id: 11377, titulo: "Hero de banda", overrides: [antetitulo, titular, bajada, cta, imagen]}
  - {id: 11380, titulo: "Banda de objeción", overrides: [etiqueta, titular, cuerpo]}
  - {id: 11383, titulo: "Paso del método", overrides: [numeral, titulo, texto]}
  - {id: 11390, titulo: "Bloque de cifras", overrides: [cifra_1, cifra_2, cifra_3, rotulo_1]}
  - {id: 11393, titulo: "Tarjeta de línea de trabajo", overrides: [titulo, texto, item_1]}

pendientes:
  - "pp-grid-3 y pp-numeral no tienen variante móvil probada en render"
  - "falta componente de formulario nativo con e-form"
  - "falta componente de cita o testimonio"

# Tipo de conocimiento → componente obligatorio. Es el dato que consulta el constructor
# antes de componer: ADAPTER.md lo exige como paso 0. `null` no es un descuido — es un
# hueco declarado, y una banda de ese tipo no se compone con widgets sueltos.
patrones:
  apertura:
    componente: 11377      # Hero de banda
  objecion:
    componente: 11380      # Banda de objeción
  proceso:
    componente: 11383      # Paso del método
  cifras:
    componente: 11390      # Bloque de cifras
  servicio:
    componente: 11393      # Tarjeta de línea de trabajo
  credencial:
    componente: null       # hueco: franja de atributos en línea
  prueba:
    componente: null
    forma: "banda de imagen propia con pie de evidencia"
    cuando: "hay imágenes propias que prueban el oficio mejor que cualquier frase"
  caso:
    componente: null       # hueco: lista editorial situación → método → resultado

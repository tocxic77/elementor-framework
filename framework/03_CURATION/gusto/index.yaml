# Regla de uso: una referencia de `origen: medido` puede citarse en 04_DIRECTION con su
# número. Una de `origen: ficha` sólo aporta la mecánica declarada por el sistema original.

# ---------------------------------------------------------------------------------------
# Las 30 que cuentan. De las 59, éstas son las que se usan para decidir; el resto es archivo.
# Criterio: 10 de autoridad (claridad, estructura, credibilidad), 10 de innovación
# (fotografía, escala, movimiento) y 10 rechazadas con motivo. Un rechazo vale tanto como
# una referencia: dice qué no se hace y por qué.
# ---------------------------------------------------------------------------------------

# Biblioteca de gusto — 54 sistemas de referencia
#
# Qué es: cada entrada es un sistema de diseño real, reducido a un espécimen comparable
# (misma estructura: paleta, tipo, radio, sombra, acciones, medida) a 1440 y 390 px.
# El espécimen se genera desde la ficha de tokens del sistema, NO es una captura del
# sitio en vivo. take/avoid se derivan de lo que la ficha declara, no de una inspección
# del sitio publicado.
#
# Cómo se usa: se elige por `take`, se descarta por `avoid`. Una firma nueva de un
# DIRECTION.md debe poder citar al menos una entrada de esta lista.
#
# Reglas:
#   take  → mecánica transferible, ≤3 por entrada.
#   avoid → lo que ese sistema hace y nuestro sistema prohíbe, ≤3 por entrada.
#   imagen→ capturas/<slug>.png, un PNG con escritorio y móvil en la misma pieza.
#
# Generado: 2026-10-31 · 59 entradas (54 ficha + 5 medidas) · 64 imágenes

meta:
  fuente: popular-web-designs (54 fichas de tokens en HTML/CSS) + 5 sitios medidos
  generador: gen_doble.py
  capturador: 1440 px + 390 px en una sola imagen
  total: 59
  medidos: 5
  fecha: 2026-10-31


cliente: Pennacchiotti
fecha: 2026-10-31
estado: completo
respuestas:
  a1:
    respuesta: Control, estandarización y desarrollo de capacidades operacionales
      para organizaciones agroalimentarias y operaciones intensivas en conocimiento
      técnico.
    fuente: docs/PRODUCT.md:10
  a2:
    respuesta: Variabilidad no explicada entre turnos, plantas y personas; conocimiento
      concentrado en una persona sin reemplazo.
    fuente: docs/PRODUCT.md:33
  a3:
    respuesta: 'Convive con la variabilidad y la resuelve de forma reactiva: cuando
      el problema se vuelve visible delega la investigación al jefe de planta, al
      responsable de calidad o a una persona con experiencia acumulada. En algunos
      casos contrata consultoría puntual para un problema específico, pero la capacidad
      no queda instalada.'
    fuente: Mario Pennacchiotti, 2026-10-31 (declaración del propietario)
    nivel: hipotesis
    nota: si se confirma en terreno, el competidor es la inercia organizacional y
      no otro consultor
  a4:
    respuesta: 'Agendar una conversación (→ /contacto/). Meta: que un gerente de operaciones
      entienda en menos de 30 s qué se vende y para quién.'
    fuente: docs/PRODUCT.md:82, docs/PRODUCT.md:89
  a5:
    respuesta: 350+ profesionales formados · 40+ organizaciones · 5 países. Autorizadas
      el 2026-10-27; ninguna otra cifra es publicable.
    fuente: docs/PRODUCT.md:71-73 · 02_EVIDENCE.yaml EV-001…003
  a6:
    respuesta: Nombres de clientes, cifras de resultados ajenos, margen >55 %, material
      de antiguos empleadores, «framework propietario» sin documento de método.
    fuente: docs/PRODUCT.md:63-65
    ampliacion: 'Además, por falta de evidencia de permanencia: nada de «transformación»,
      «cambio cultural», «impacto sostenido» ni «resultados garantizados» como afirmaciones
      consumadas. Sí: diagnóstico, criterio explícito, instalación de capacidades,
      transferencia. (Mario, 2026-10-31)'
  b1:
    respuesta: Decide el propietario, gerente general o director de operaciones. Influyen
      gerencia de calidad, producción y procesos.
    fuente: Mario, 2026-10-31 · docs/PRODUCT.md:23
  b2:
    respuesta: Utilizan los entregables supervisores, jefaturas técnicas y responsables
      operacionales.
    fuente: Mario, 2026-10-31
  b3:
    respuesta: «Ya hemos intentado resolver esto antes y el cambio no permaneció.
      No quiero pagar por un diagnóstico o un procedimiento que termine guardado en
      una carpeta sin cambiar la operación.»
    fuente: Mario Pennacchiotti, 2026-10-31 (declaración del propietario)
    nivel: hipotesis
    nota: elegida como la objeción única de todo el sitio; la primera banda la responde
      y la revisión a 90 días la mide
  b4:
    respuesta: 'Conoce su operación, pero no dispone de criterios explícitos para
      explicar toda la variabilidad observada. No requiere formación técnica básica:
      requiere capacidad para diagnosticar, estructurar y transferir conocimiento
      operativo.'
    fuente: Mario, 2026-10-31
  b5:
    respuesta: Principalmente computador en oficina, horario laboral. Secundariamente
      móvil por enlaces enviados por correo o mensajería. El primer contacto suele
      ser en escritorio; la validación posterior en móvil.
    fuente: Mario, 2026-10-31
    consecuencia: escritorio primero (≥1440 px); móvil correcto pero no prioritario
      en el argumento
  c1:
    respuesta: '20 imágenes: 11 usables a sangre (3840-4032 px), 9 exportaciones bajo
      1600 px, 1 ilegible. 6 clips de 10 s. Falta retrato del autor.'
    fuente: 03_ASSETS.yaml (medido con inventario_activos.py, 2026-10-31)
  c2:
    respuesta: 'EV-001 350+ profesionales · EV-002 40+ organizaciones · EV-003 5 países.
      Rechazadas: margen >55 % y resultados de empresas donde fue empleado.'
    fuente: 02_EVIDENCE.yaml
  c3:
    respuesta: 'Material de clientes sin autorización escrita y procesos identificables
      de plantas de terceros. Casos abiertos: linea marraqueta.jpg (letrero de planta)
      e indicadores nir.jpeg (valores de lote legibles).'
    fuente: docs/PRODUCT.md:96-98 · 03_SELECCION.md
  c4:
    respuesta: 'Falta: retrato del autor (una sesión), fotos de trabajo con personas
      (no existen), un caso documentado (no existe), autorización de la planta para
      linea marraqueta.jpg.'
    fuente: 03_SELECCION.md
  c5:
    respuesta: Mario autoriza material propio. Para instalaciones de terceros autoriza
      el propietario o representante autorizado de esa organización; sin esa firma
      la pieza no se publica.
    fuente: Mario, 2026-10-31
  d1:
    respuesta: Mario, sobre WordPress + Elementor. El texto vive en patrones y tokens,
      no en el builder.
    fuente: DIRECTION.md E-7
  d2:
    respuesta: 'Se pueden cambiar textos, imágenes, videos, orden de bandas y selección
      de patrones. No se modifican sin revisión: tipografía, paleta, escala, espaciado,
      rejilla y decisiones de firma.'
    fuente: Mario, 2026-10-31
  d3:
    respuesta: 'Firma Mario Pennacchiotti. Congeladas por un proyecto completo: (1)
      numerales prominentes en serif como marcador estructural, (2) filetes de 1 px
      como sistema de separación y composición, (3) fotografía documental en color
      real, con duotono reservado a abstracciones, diagramas y recursos conceptuales.'
    fuente: Mario Pennacchiotti, 2026-10-31 (firma)
  d4:
    respuesta: Revisión formal a los 90 días de publicar; luego cada 12 meses o ante
      un cambio relevante en posicionamiento, servicios o audiencia.
    fuente: Mario, 2026-10-31
decisiones_sitio:
  q1_conversion:
    respuesta: Formulario primero; WhatsApp visible pero nunca como acción principal.
      El formulario filtra y deja contexto.
    fuente: Mario, 2026-10-31
  q2_estructura:
    respuesta: 'Multipágina: / · /soluciones/ · /perspectivas/ · /sobre-mi/ · /contacto/.
      No una landing única.'
    fuente: Mario, 2026-10-31
    motivo: Soluciones responde qué; Perspectivas construye autoridad; Sobre mí construye
      confianza; Contacto convierte. Además el framework necesita probar estructuras
      multipágina.
  q3_reemplazo:
    respuesta: Reemplazo completo de lo publicado el 2026-10-28, mismo dominio, sin
      coexistencia de dos narrativas.
    fuente: Mario, 2026-10-31
  q4_acceso:
    respuesta: 'Hay acceso administrativo. Aun así: sin copia verificada y restauración
      comprobable no se interviene producción. Backuply + cPanel antes de E-3.'
    fuente: Mario, 2026-10-31
  q5_hero:
    respuesta: Póster + loop de 6 s. El clip de 60 s queda como activo documental,
      no como componente.
    fuente: Mario, 2026-10-31
intencion:
  existe_para: generar conversaciones comerciales calificadas
  cambia_si_no_existe: El negocio pierde su vitrina digital de alta especialización
    técnica y queda limitado a redes de contacto offline, diluido frente a proveedores
    genéricos sin sustento analítico
  objetivo_economico: Posicionar autoridad técnica en reología de cereales y calidad
    de harinas para captar consultas directas y proyectos de asesoría B2B de molinos,
    laboratorios y agroindustria alimentaria
  audiencia:
  - propietarios
  - gerentes de operaciones
  - gerentes de calidad
  no_audiencia:
  - estudiantes
  - curiosos
  - búsqueda de información general
  quiere_que_piense: conoce la operación real
  quiere_que_recuerde: transforma conocimiento tácito en criterio explícito
  objecion: ya probamos algo parecido y no quedó nada
  accion: agendar una conversación
  medicion: formularios enviados
  fuente: Mario Pennacchiotti, 2026-10-31
referencias:
  fuente: Mario Pennacchiotti, 2026-11-01
  estado: registrada · en conflicto con la ley visual · pendiente de decisión
  conflicto: docs/DESIGN.md:12-16 declara «no es una landing de startup tecnológica»
    y veta sombras difusas, radios grandes y azul tecnológico; CAMBIOS ya había rechazado
    Linear y Stripe por esa razón. Se registran como estándar de precisión, no como
    paleta.
  items:
  - sitio: https://stripe.com
    seccion: hero
    por_que: sans de alto contraste, espaciado limpio, jerarquía tipográfica estricta
      sin adornos
    se_adopta: aire y jerarquía; no su paleta, sus degradados ni su sans (el sitio
      usa Newsreader en display)
    contradice: DESIGN.md:12-16
  - sitio: https://linear.app
    seccion: grillas y bordes
    por_que: precisión de 1 px y contenido que sostiene el diseño, sin ornamento vacío
    se_adopta: filetes de 1 px y rejilla; no el modo oscuro saturado ni las animaciones
    contradice: DESIGN.md:12-16 (anti-referencia declarada)
